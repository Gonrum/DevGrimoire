# Standalone MongoDB (without Replica Set) — for ARM/embedded devices
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.standalone.yml up -d
#
# Differences to default (replica set) mode:
# - MongoDB runs without --replSet (no Change Streams, no transactions)
# - mongodb-init service is disabled (not needed)
# - Backend uses MONGODB_STANDALONE=true to skip Change Stream watchers
# - SSE live updates still work via EventEmitter (same-process events)

services:
  mongodb:
    # H-29: vorher `entrypoint: ["mongod", …]`. Das ersetzte den Image-
    # Entrypoint — und nur der legt aus MONGO_INITDB_ROOT_* den Admin-User an.
    # Auf frischem Volume lief mongod dann mit --auth und ohne einen einzigen
    # User, der Healthcheck schlug dauerhaft fehl, das Backend startete nie.
    # Jetzt: Image-Entrypoint behalten, nur die mongod-Argumente setzen
    # (docker-entrypoint.sh ergänzt --auth selbst, sobald ein Root-User
    # konfiguriert ist).
    entrypoint: ["docker-entrypoint.sh"]
    command: ["mongod", "--bind_ip_all", "--wiredTigerCacheSizeGB", "0.25"]
    healthcheck:
      test: ["CMD", "mongosh", "-u", "${MONGO_USER}", "-p", "${MONGO_PASSWORD}", "--authenticationDatabase", "admin", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  mongodb-init:
    profiles: ["disabled"]

  backend:
    # `!override` statt Merge: die Basis-Datei lässt das Backend auf
    # `mongodb-init` warten, das hier per Profil abgeschaltet ist. Gemergt
    # blieb diese Abhängigkeit stehen, und aktuelles `docker compose` lehnte
    # die Kombination ab ("depends on undefined service mongodb-init").
    depends_on: !override
      mongodb:
        condition: service_healthy
      searxng:
        condition: service_started
      redis:
        condition: service_healthy
    environment:
      MONGODB_STANDALONE: "true"
      NODE_HEAP_SIZE: "${NODE_HEAP_SIZE:-256}"
