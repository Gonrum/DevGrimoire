services:
  mongodb:
    image: mongo:7
    container_name: devgrimoire-mongodb
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB}
    entrypoint: ["/bin/bash", "-c", "if [ ! -f /keyfile/mongo-keyfile ]; then openssl rand -base64 756 > /keyfile/mongo-keyfile; fi && chmod 400 /keyfile/mongo-keyfile && chown 999:999 /keyfile/mongo-keyfile && exec docker-entrypoint.sh mongod --replSet rs0 --keyFile /keyfile/mongo-keyfile"]
    volumes:
      - mongodb_data:/data/db
      - mongodb_keyfile:/keyfile
    healthcheck:
      test: ["CMD", "mongosh", "-u", "${MONGO_USER}", "-p", "${MONGO_PASSWORD}", "--authenticationDatabase", "admin", "--eval", "rs.status().ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  mongodb-init:
    image: mongo:7
    container_name: devgrimoire-mongodb-init
    restart: "no"
    depends_on:
      mongodb:
        condition: service_started
    entrypoint: ["/bin/bash", "-c", "sleep 10 && mongosh 'mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongodb:27017/?authSource=admin&directConnection=true' --eval 'try { rs.status(); print(\"Replica set already initialized\"); } catch(e) { rs.initiate({ _id: \"rs0\", members: [{ _id: 0, host: \"mongodb:27017\" }] }); print(\"Replica set initiated\"); }'"]
    environment:
      MONGO_USER: ${MONGO_USER}
      MONGO_PASSWORD: ${MONGO_PASSWORD}

  # SearXNG — self-hosted meta search engine for MCP web_search/web_fetch tools
  searxng:
    image: searxng/searxng:latest
    container_name: devgrimoire-searxng
    restart: unless-stopped
    environment:
      SEARXNG_BASE_URL: "http://searxng:8080/"
      SEARXNG_SECRET: ${SEARXNG_SECRET:-change-me-to-a-random-32-char-string}
      UWSGI_WORKERS: 2
      UWSGI_THREADS: 4
    volumes:
      - ./docker/searxng/settings.yml:/etc/searxng/settings.yml:ro
      - ./docker/searxng/limiter.toml:/etc/searxng/limiter.toml:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8080/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Workspace sidecar — isolated container that owns the per-project clone
  # volume and exposes a small HTTP API consumed only by the API backend over
  # the internal `workspace-api-net`. It has no route to MongoDB or the API.
  #
  # NETWORK REACH (operator note): the sidecar joins `workspace-net` (a
  # regular bridge with NAT), so workspace_exec commands CAN reach hosts on
  # the operator's own LAN — including services running on the docker host
  # itself (e.g. an internal SQL server, dev tooling, router admin). This is
  # intentional: a self-hosted instance often *needs* to query a local DB or
  # internal API from the agent. RFC1918 / LAN egress filtering is left to
  # the operator's host firewall (iptables/UFW/nftables) where it belongs.
  # If you run this in a multi-tenant or untrusted-agent setting, gate
  # egress at the host before exposing workspace_exec.
  workspace:
    build:
      context: ./workspace
      dockerfile: Dockerfile
    container_name: devgrimoire-workspace
    restart: unless-stopped
    environment:
      WORKSPACE_API_TOKEN: ${WORKSPACE_API_TOKEN:?WORKSPACE_API_TOKEN must be set (>=16 chars) for the sidecar}
      WORKSPACE_ROOT: /workspaces
      PORT: 9000
      # Match MinIO MAX_FILE_SIZE (50MB default) so workspace_attachment_save can
      # handle realistic build artifacts. Sidecar default is 5MB, far too small.
      READ_MAX_BYTES: ${WORKSPACE_READ_MAX_BYTES:-52428800}
    volumes:
      - workspace_data:/workspaces
    networks:
      - workspace-net      # outbound: git/npm/etc.
      - workspace-api-net  # inbound: only the API backend
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.25'
          memory: 256M
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN          # git checkout sets file ownership
      - DAC_OVERRIDE   # allow operating across workspace subdirs
      - FOWNER         # git index ownership checks
      - SETUID         # node runtime
      - SETGID

  redis:
    image: redis:7-alpine
    container_name: devgrimoire-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: devgrimoire-backend
    restart: unless-stopped
    ports:
      - "3200:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
      - workspace-api-net  # only the API may talk to the sidecar
    environment:
      # Sidecar wiring — backend resolves the sidecar via service DNS on
      # the internal workspace-api-net. Token is the shared secret.
      WORKSPACE_API_URL: ${WORKSPACE_API_URL:-http://workspace:9000}
      WORKSPACE_API_TOKEN: ${WORKSPACE_API_TOKEN:-}
      MONGODB_URI: ${MONGODB_URI}
      PORT: 3000
      CORS_ORIGIN: http://localhost
      AUTH_USERNAME: ${AUTH_USERNAME:-}
      AUTH_PASSWORD: ${AUTH_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET:-}
      SECRETS_ENCRYPTION_KEY: ${SECRETS_ENCRYPTION_KEY:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      RAG_EMBEDDING_PROVIDER: ${RAG_EMBEDDING_PROVIDER:-ollama}
      RAG_EMBEDDING_URL: ${RAG_EMBEDDING_URL:-}
      RAG_EMBEDDING_MODEL: ${RAG_EMBEDDING_MODEL:-nomic-embed-text}
      RAG_FALLBACK_PROVIDER: ${RAG_FALLBACK_PROVIDER:-}
      RAG_FALLBACK_URL: ${RAG_FALLBACK_URL:-}
      RAG_FALLBACK_MODEL: ${RAG_FALLBACK_MODEL:-}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      # Web Search (MCP web_search/web_fetch)
      SEARXNG_URL: ${SEARXNG_URL:-http://searxng:8080}
      # MinIO (optional — file storage)
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-}
      MINIO_PORT: ${MINIO_PORT:-9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-}
      MINIO_BUCKET: ${MINIO_BUCKET:-devgrimoire}
      MINIO_USE_SSL: ${MINIO_USE_SSL:-false}
      # Backups (daily full-system backup at 06:00 by default)
      BACKUP_DAILY_ENABLED: ${BACKUP_DAILY_ENABLED:-true}
      BACKUP_CRON: ${BACKUP_CRON:-0 6 * * *}
      BACKUP_MINIO_BUCKET: ${BACKUP_MINIO_BUCKET:-devgrimoire-backups}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      POOL_WAIT_TIMEOUT_MS: ${POOL_WAIT_TIMEOUT_MS:-120000}
      DEFAULT_LLM_TIMEOUT_MS: ${DEFAULT_LLM_TIMEOUT_MS:-1800000}
    volumes:
      - lancedb_data:/app/data/lancedb
    depends_on:
      mongodb-init:
        condition: service_completed_successfully
      searxng:
        condition: service_started
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/api/auth/status').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # MinIO — optional S3-compatible object storage for file attachments
  # Uncomment to enable file storage features
  # minio:
  #   image: minio/minio:latest
  #   container_name: devgrimoire-minio
  #   restart: unless-stopped
  #   command: server /data --console-address ":9001"
  #   ports:
  #     - "9000:9000"
  #     - "9001:9001"
  #   environment:
  #     MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
  #     MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
  #   volumes:
  #     - minio_data:/data
  #   healthcheck:
  #     test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: devgrimoire-frontend
    restart: unless-stopped
    ports:
      - "80:8080"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mongodb_data:
  mongodb_keyfile:
  lancedb_data:
  workspace_data:
  redis_data:
  # minio_data:

networks:
  default:
  # Outbound network for the workspace sidecar — git clones, npm pulls etc.
  workspace-net:
  # Internal-only bridge between API backend and workspace sidecar. The
  # sidecar can therefore not reach MongoDB nor the wider docker network.
  workspace-api-net:
    internal: true
