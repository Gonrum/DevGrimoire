# Access log without the query string. The default format logs the full
# request line, and several clients authenticate through it: MCP clients via
# `/sse?apiKey=cv_…`, the browser via `?token=<jwt>` on WebSockets and SSE.
# Long-lived API keys ended up in plaintext in `docker logs`. `$uri` is the
# path only; the request itself still reaches the backend unchanged.
log_format noquery '$remote_addr - $remote_user [$time_local] '
                   '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                   '"$http_referer" "$http_user_agent"';

server {
    listen 8080;
    access_log /dev/stdout noquery;

    # Backend-Adresse zur Laufzeit auflösen statt einmal beim Start: Mit
    # fester Adresse im proxy_pass merkt sich nginx die IP des
    # Backend-Containers bis zum eigenen Neustart. Nach jedem
    # `docker compose up -d --build backend` (neuer Container, neue IP) lieferte
    # :80 dauerhaft 502 — auch die MCP-SSE-Verbindung über /sse. Mit einer
    # Variable im proxy_pass fragt nginx Dockers DNS (127.0.0.11) und hält
    # die Antwort höchstens 10 s.
    #
    # Folge der Variable: nginx ersetzt keinen Location-Präfix mehr, deshalb
    # trägt jeder proxy_pass `$request_uri` (alle Locations reichten den Pfad
    # ohnehin unverändert durch).
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;
    set $backend http://backend:3000;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; frame-ancestors 'self';" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;

    # nginx-Default wäre 1m — das deckelt JEDEN Upload (Attachments, Chat,
    # inline ssh_upload über /mcp) mit 413, bevor das Backend seine eigenen
    # Limits sieht. 100m spiegelt das Express-Limit aus main.ts
    # (json({ limit: '100mb' })); der SFTP-Streaming-Endpoint hebt es weiter an.
    client_max_body_size 100m;

    location /api/events {
        # Credentials travel in the query here (?apiKey= / ?token=). nginx
        # writes the full request line into error-log entries (e.g. upstream
        # errors during a backend restart) and that format cannot be changed,
        # so only critical errors are logged for this location.
        error_log /dev/stderr crit;
        proxy_pass $backend$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        chunked_transfer_encoding off;
    }

    # WebSocket multiplex bus for live events. Must come BEFORE /api/ so the
    # regex match wins. One WS per tab replaces 3 SSE EventSources, freeing
    # the HTTP/1.1 6-connections-per-origin pool.
    location ~ ^/api/ws/ {
        # Credentials travel in the query here (?apiKey= / ?token=). nginx
        # writes the full request line into error-log entries (e.g. upstream
        # errors during a backend restart) and that format cannot be changed,
        # so only critical errors are logged for this location.
        error_log /dev/stderr crit;
        proxy_pass $backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # WebSocket terminal — must come BEFORE /api/ so the regex match wins.
    # Sends Upgrade/Connection so nginx tunnels the WS upgrade through.
    location ~ ^/api/workspaces/[^/]+/terminal/?$ {
        # Credentials travel in the query here (?apiKey= / ?token=). nginx
        # writes the full request line into error-log entries (e.g. upstream
        # errors during a backend restart) and that format cannot be changed,
        # so only critical errors are logged for this location.
        error_log /dev/stderr crit;
        proxy_pass $backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # SSH terminal — analog zum Workspace-Terminal. Muss vor /api/ stehen.
    location ~ ^/api/ssh/[^/]+/terminal/?$ {
        # Credentials travel in the query here (?apiKey= / ?token=). nginx
        # writes the full request line into error-log entries (e.g. upstream
        # errors during a backend restart) and that format cannot be changed,
        # so only critical errors are logged for this location.
        error_log /dev/stderr crit;
        proxy_pass $backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # SFTP-Streaming-Upload — muss vor /api/ stehen. Das Backend erlaubt bis zu
    # 500 MB (Admin-Setting ssh.maxUploadBytes, geclampt in upload-limit.util),
    # deshalb hier 512m statt der globalen 100m. proxy_request_buffering off,
    # damit nginx den Body direkt weiterstreamt statt die ganze Datei erst in
    # ein Tempfile zu spoolen — sonst ist am Endpoint nichts "streaming".
    location ~ ^/api/ssh-connections/[^/]+/upload/?$ {
        proxy_pass $backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 512m;
        proxy_request_buffering off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # IDE file download: streamed, never buffered. proxy_read_timeout is the
    # idle time between two reads, not the total duration, so a multi-GB log
    # may take as long as the link needs. Must stay before /api/.
    location ~ ^/api/workspaces/[^/]+/fs/raw$ {
        proxy_pass $backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    # IDE save: the body is the whole file as JSON. The backend accepts up to
    # 230 MiB here (editor hard max, JSON-escaped) and answers 413 with the
    # limit in force; only this route is raised above the global 100m.
    location ~ ^/api/workspaces/[^/]+/fs/file$ {
        proxy_pass $backend$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 232m;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        # Even nginx's own 413 stays JSON, as the IDE expects.
        error_page 413 = @fs_file_too_large;
    }

    location @fs_file_too_large {
        default_type application/json;
        return 413 '{"error":"request body too large","message":"request body too large"}';
    }

    location /api/ {
        proxy_pass $backend$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # H-7: nginx-Default sind 60 s. POST /api/backups und
        # POST /api/rag/reindex laufen synchron länger und endeten mit 504,
        # während die Arbeit serverseitig weiterlief — der Admin wiederholte,
        # und es gab doppelte Backups bzw. Reindex-Läufe.
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    # MCP Streamable HTTP endpoint
    location /mcp {
        # Credentials travel in the query here (?apiKey= / ?token=). nginx
        # writes the full request line into error-log entries (e.g. upstream
        # errors during a backend restart) and that format cannot be changed,
        # so only critical errors are logged for this location.
        error_log /dev/stderr crit;
        proxy_pass $backend$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
    }

    # MCP Legacy SSE endpoint
    location /sse {
        # Credentials travel in the query here (?apiKey= / ?token=). nginx
        # writes the full request line into error-log entries (e.g. upstream
        # errors during a backend restart) and that format cannot be changed,
        # so only critical errors are logged for this location.
        error_log /dev/stderr crit;
        proxy_pass $backend$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        chunked_transfer_encoding off;
    }

    # MCP Legacy SSE message endpoint
    location /messages {
        # Credentials travel in the query here (?apiKey= / ?token=). nginx
        # writes the full request line into error-log entries (e.g. upstream
        # errors during a backend restart) and that format cannot be changed,
        # so only critical errors are logged for this location.
        error_log /dev/stderr crit;
        proxy_pass $backend$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # MCP Discovery metadata (T-266) — clients fetch /.well-known/mcp[.json]
    # via the public host without needing the backend port. Prefix match catches
    # both /.well-known/mcp and /.well-known/mcp.json; proxy_pass without a path
    # forwards the original request URI verbatim. Also routes the registry
    # manifest endpoint /.well-known/mcp-server.json (T-268).
    location /.well-known/mcp {
        proxy_pass $backend$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # MCP Registry manifest (T-268) — private server.json next to discovery.
    # Without this exact-match route /server.json falls through to the SPA
    # try_files and returns index.html instead of the JSON manifest.
    location = /server.json {
        proxy_pass $backend$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # MCP OAuth authorization server (backend, only active with PUBLIC_BASE_URL).
    # Exact paths only, so no SPA route is shadowed; the consent page itself
    # (/oauth/consent) stays an SPA route. The rate limits of these endpoints
    # count per client IP, which relies on X-Forwarded-For reaching Express.
    location = /authorize {
        proxy_pass $backend$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /token {
        proxy_pass $backend$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /register {
        proxy_pass $backend$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /revoke {
        proxy_pass $backend$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # OAuth metadata: /.well-known/oauth-protected-resource/mcp and
    # /.well-known/oauth-authorization-server (404 from the backend while OAuth is off).
    location ^~ /.well-known/oauth- {
        proxy_pass $backend$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
